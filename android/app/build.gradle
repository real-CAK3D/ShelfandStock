plugins { id 'com.android.application' }
android {
    namespace 'com.cak3d.larder'
    compileSdk 36
    defaultConfig {
        applicationId 'com.cak3d.shelfandstock'
        minSdk 24
        targetSdk 36
        versionCode 10700
        versionName '1.7.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    // the web app is copied in by build.sh
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
}
dependencies {
    // Google ML Kit text recognition through Play services: free, on the phone, offline once the model is in
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    // Google's barcode scanner screen (the one most scanner apps use) and ML Kit barcode reading on photos: free, on the phone
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
}
